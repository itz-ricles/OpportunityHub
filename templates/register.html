{% extends "base.html" %}
{% from "partials/forms.html" import csrf, error_list %}
{% block title %}Sign up | OpportunityHub{% endblock %}
{% block content %}
<section class="container auth section">
  <h1>Create your account</h1>
  <form class="form card" method="post">
    {{ csrf() }}
    {{ error_list(errors) }}
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" type="text" autocomplete="name" value="{{ values.get('full_name', '') }}" required>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" value="{{ values.get('email', '') }}" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required aria-describedby="pw-help">
    <small id="pw-help" class="muted">At least 8 characters.</small>
    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
    <button class="btn btn-block" type="submit">Create account</button>
  </form>
  <p class="center">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
