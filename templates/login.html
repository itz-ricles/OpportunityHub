{% extends "base.html" %}
{% from "partials/forms.html" import csrf, error_list %}
{% block title %}Log in | OpportunityHub{% endblock %}
{% block content %}
<section class="container auth section">
  <h1>Log in</h1>
  <form class="form card" method="post">
    {{ csrf() }}
    {{ error_list(errors) }}
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" value="{{ email }}" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn btn-block" type="submit">Log in</button>
  </form>
  <p class="center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
